apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-registry
  labels:
    app: node-registry
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-registry
  template:
    metadata:
      labels:
        app: node-registry
        tier: backend
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h db -p 5432 || pg_isready -h postgres -p 5432; do echo waiting for db; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: node-registry
          image: node-registry:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: node-registry-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
